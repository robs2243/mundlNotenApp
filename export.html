<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Noten Export</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <div class="header-controls">
        <h1>Noten Export</h1>
        <div id="status">Verbinde mit Firebase...</div>
        <div class="controls-grid">
            <div>
                <label for="encryptionPassword"><b>Verschluesselungspasswort</b></label>
                <input type="password" id="encryptionPassword" placeholder="Passwort eingeben">
            </div>
            <div>
                <label for="schoolYear">Schuljahr</label>
                <input type="text" id="schoolYear" placeholder="z.B. 2024-2025">
            </div>
            <div>
                <label for="classSelector">Klasse</label>
                <select id="classSelector">
                    <option value="">Klasse auswaehlen</option>
                </select>
            </div>
            <div class="button-group">
                <button id="backButton" class="btn btn-primary">Zurueck zur Hauptseite</button>
                <button id="exportButton" class="btn btn-success">CSV-Export</button>
                <button id="logoutButton" type="button" class="btn btn-secondary">Abmelden</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js" type="module"></script>
    <script src="exportjs.js" type="module"></script>
</body>
</html>
