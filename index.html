            <div>
                <label for="encryptionPassword"><b>Verschlüsselungspasswort</b></label>
                <input type="password" id="encryptionPassword" placeholder="Geheimes Passwort eingeben">
            </div>
            <div>
                <label for="classSelector">Klasse</label>
                <select id="classSelector">
                    <option value="E1ME2">E1ME2</option>
                    <option value="A2IT5">A2IT5</option>
                </select>
            </div>
            <div>
                <label for="dateSelector">Datum</label>
                <input type="date" id="dateSelector">
            </div>
            <div>
                <button id="picsUpload">Bilder hochladen</button>
            </div>
        </div>
    </div>
