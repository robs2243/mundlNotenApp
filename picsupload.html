<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilder hochladen</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="picsuploadjs.js"></script>
</head>
<body>
    <div class="header-controls">
        <h1>Bilder hochladen (Batch moeglich)</h1>
        <div id="status">Verbinde mit Firebase...</div>
        <div class="controls-grid">
            <div>
                <label for="encryptionPassword">Verschluesselungspasswort</label>
                <input type="password" id="encryptionPassword" placeholder="Passwort eingeben">
            </div>
            <div>
                <label for="schoolYear">Schuljahr</label>
                <input type="text" id="schoolYear" placeholder="Schuljahr eingeben (z.B. 2024-2025)">
            </div>
            <div>
                <label for="classSelector">Klasse</label>
                <input type="text" id="classSelector" placeholder="Klasse eingeben (z.B. E1ME2)">
            </div>
            <div>
                <label for="imageUpload">Bilder auswaehlen (mehrere moeglich, Format: Nachname_Vorname.jpg)</label>
                <input type="file" id="imageUpload" accept="image/*" multiple>
                <div id="previewContainer"></div>
            </div>
            <div class="button-group">
                <button id="backButton" class="btn btn-primary">Zurueck zur Hauptseite</button>
                <button id="uploadButton" class="btn btn-success">Hochladen</button>
                <button id="logoutButton" type="button" class="btn btn-secondary">Abmelden</button>
            </div>
        </div>
    </div>
</body>
</html>
